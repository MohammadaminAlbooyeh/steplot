[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steplot"
version = "0.1.0"
description = "Lightweight observability for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
steplot = "steplot.cli:main"

[project.urls]
Homepage = "https://github.com/MohammadaminAlbooyeh/steplot"
Repository = "https://github.com/MohammadaminAlbooyeh/steplot"
Issues = "https://github.com/MohammadaminAlbooyeh/steplot/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["steplot"]

[tool.hatch.build.targets.wheel.force-include]
"steplot/py.typed" = "steplot/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["steplot", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
packages = ["steplot"]